spring.application.name=backend
server.port=8088

# PostgreSQL DataSource Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/hospital_db
spring.datasource.username=postgres
spring.datasource.password=post
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===================================================================
# Email / SMTP Configuration (Google Gmail SMTP)
# ===================================================================
# To send real emails, provide your email & Google App Password below or via environment variables MAIL_USERNAME & MAIL_PASSWORD
# NOTE: For Gmail, use an App Password (Google Account > Security > 2-Step Verification > App passwords)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=23it010@drngpit.ac.in
spring.mail.password=Student@123
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Hospital Mail Sender Settings
hospital.mail.from=${spring.mail.username:no-reply@vrhospital.com}
hospital.mail.enabled=${HOSPITAL_MAIL_ENABLED:true}
